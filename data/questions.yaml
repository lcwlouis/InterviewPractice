# InterviewPractice — expanded question bank (100+ questions)
# Organised by interview type → phase → difficulty

warmup:
  - id: w1
    text: "Walk me through your background and what brings you here today."
    interview_type: behavioural
    seniority: any
    role_family: general
    competencies: [communication_clarity, motivation]
    difficulty: 1
    interviewer_type: hr
    phase: warmup

  - id: w2
    text: "What about this role or company excites you the most?"
    interview_type: behavioural
    seniority: any
    role_family: general
    competencies: [motivation, business_awareness]
    difficulty: 1
    interviewer_type: hr
    phase: warmup

  - id: w3
    text: "How would you describe yourself in three words?"
    interview_type: behavioural
    seniority: any
    role_family: general
    competencies: [communication_clarity]
    difficulty: 1
    interviewer_type: hr
    phase: warmup

  - id: w4
    text: "What's been the highlight of your career so far?"
    interview_type: behavioural
    seniority: any
    role_family: general
    competencies: [motivation, ownership]
    difficulty: 1
    interviewer_type: hr
    phase: warmup

  - id: w5
    text: "Tell me about a typical day in your current role."
    interview_type: behavioural
    seniority: any
    role_family: general
    competencies: [communication_clarity, ownership]
    difficulty: 1
    interviewer_type: hr
    phase: warmup

